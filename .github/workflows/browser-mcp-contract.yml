name: Browser MCP contract

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && github.event.pull_request.draft
      && format('{0}-passive-draft-{1}', github.workflow, github.run_id)
      || (github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number)
      || format('{0}-manual-{1}', github.workflow, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"

jobs:
  contract:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-env
        with:
          cache-mode: restore
          install-bun: "false"
      - name: Exercise the pinned MCP server in Chromium
        run: pnpm test:e2e:browser-mcp
